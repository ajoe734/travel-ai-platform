ss="tiny muted">供應預訂</span><h3 class="mt12">${state.booking==='confirmed'?'已確認':state.payment==='paid'?'結果核對中':'尚未送出'}</h3></div><div class="statustile"><span class="tiny muted">通知</span><h3 class="mt12">${state.booking==='confirmed'?'已送出':'等待訂妥'}</h3></div></div><div class="separator"></div><h3 class="mb16">執行時間線</h3><div class="timeline"><div class="event good"><strong>14:06 正式報價已建立</strong><div class="muted">Q-026 rev.2；與人數及條款綁定。</div></div><div class="event ${state.payment==='paid'?'good':''}"><strong>${state.payment==='paid'?'14:08 收款結果已核對':'等待客戶確認並付款'}</strong><div class="muted">只採信正式回呼與金流查詢。</div></div><div class="event ${state.booking==='confirmed'?'good':state.payment==='paid'?'warn':''}"><strong>${state.booking==='confirmed'?'14:09 原預約系統確認成功':state.payment==='paid'?'預訂回應待核對':'尚未向供應商下單'}</strong><div class="muted">${state.booking==='confirmed'?'外部參考：BOOK-DEMO-024':'結果未知先查單，不盲目再下一筆。'}</div></div></div>${state.payment==='paid'&&state.booking!=='confirmed'?'<div class="callout amber">款項已核對，預訂尚未確認。原型使用手動「核對外部結果」模擬後端查單，不會自動假定成功。</div>':''}</div></div>`}
function complaint(){let pending=state.refund==='pending',done=state.refund==='done';return heading('CUSTOMER CARE · C-017','把客訴處理到有結果。','先看成交時的承諾，再執行被授權的補救。',b('原訂單快照','snapshot')+b('升級給負責人','escalate'))+`<div class="grid" style="grid-template-columns:minmax(0,1fr) 370px"><div class="stack"><div class="card"><div class="between mb16"><div class="row"><span class="avatar">B</span><div><h2>語言接待與購買承諾不一致</h2><span class="small muted">旅客 B · ORD-1108-017 · 2026/11/08 已履約</span></div></div>${tag(state.complaintClosed?'已結案':done?'待客戶回覆':pending?'補救執行中':'核對處理方案',state.complaintClosed?'green':'amber')}</div><div class="bubble">「購買頁寫有英文講師，但現場只有中文示範。我希望你們說明並提供處理。」</div><div class="row mt16">${tag('身分已驗證','green')}${tag('原訂單已連結','green')}<span class="tiny muted">Email 驗證 · 不以來電顯示授權</span></div></div><div class="card focusmark">${mark(1)}<h2 class="mb16">對照原始證據</h2><div class="grid g2"><div><div class="eyebrow">成交當時</div><h3>渠道商品快照 · v4</h3><div class="callout amber mt12">原頁面：「含英文講師」<br>保存時間：2026/11/02（示例）</div></div><div><div class="eyebrow">服務確認紀錄</div><h3>商家接待紀錄</h3><div class="callout mt12">實際：中文示範＋英文說明卡。<br>商家已確認文字表述有落差。</div></div></div><p class="footnote mt16">目前商品已改為 v5；不得拿現在的網頁否定舊訂單承諾。客戶陳述與已確認事實分別保存。</p></div><div class="card"><h2 class="mb16">處理進度</h2><div class="timeline"><div class="event good"><strong>受理並核對身分</strong><div class="muted">同一訂單跨文字／電話接續同一案。</div></div><div class="event good"><strong>已找到原始承諾與商家確認</strong><div class="muted">附件僅限本案，不作為行銷素材。</div></div><div class="event ${done?'good':pending?'warn':''}"><strong>${done?'原付款路徑退款成功':pending?'退款請求已送出，等待結果':'等待客戶接受處理方案'}</strong><div class="muted">${done?'RF-DEMO-017 · 已退 NT$ 600':pending?'RF-DEMO-017 · 禁止重複退款':'先預覽影響，再執行。'}</div></div></div></div></div><div class="stack"><div class="card focusmark">${mark(2)}<div class="between mb12"><h2>處理方案</h2>${tag('政策內可執行','green')}</div><div class="small muted">部分退款 · 依商家預先核准範圍</div><div class="metric mt12">NT$ 600</div>${dl('原付款','NT$ 3,000')}${dl('計算方式','示例政策：20%')}${dl('政策版本','DEMO-R02 · v1')}${dl('退款路徑','原渠道收款方／原支付工具')}${dl('執行狀態',done?'正式結果：已退款':pending?'處理中，不能再次退款':'尚未送出')}<div class="callout amber mt12">金額與政策均為原型測試資料，不是已決定的正式補償政策。</div><label class="check mt16"><input id="refundConsent" type="checkbox" ${state.refundConsent?'checked':''} ${pending||done?'disabled':''}><span>已記錄客戶接受本處理方案；核對原路徑與本案累計退款。</span></label>${b(done?'退款結果已核對':pending?'退款處理中':'執行政策內退款（示範）','refund-preview','primary full mt16',!state.refundConsent||pending||done)}${pending?b('查核退款結果（示範）','verify-refund','full mt12'):''}${done?'<div class="callout mt16">退款已完成，客訴仍待客戶確認。補救完成不等於爭議已解決。</div>':''}</div><div class="card"><h3 class="mb12">結案前檢查</h3><label class="check"><input id="customerAccepted" type="checkbox" ${state.customerAccepted?'checked':''} ${!done?'disabled':''}><span>客戶已確認接受結果，且沒有未完成補救。</span></label>${b(state.complaintClosed?'案件已結案':'完成案件（示範）','close-complaint','full mt16',!done||!state.customerAccepted||state.complaintClosed)}<p class="footnote mt12">客戶未回覆不算滿意；案件可以保留等待或重新開案。</p></div></div></div>`}
function insights(){return heading('BUSINESS INSIGHTS','先看證據，再談怎麼改善。','示例期間：2026/10/13–11/11 · 按案件去重 · 不把沉默當原因',b('查看資料覆蓋','coverage'))+`<div class="grid g4 mb20"><div class="card"><span class="small muted">有效詢問</span><div class="metric mt12">128 <small>件</small></div><span class="footnote">獨立需求案件</span></div><div class="card"><span class="small muted">完成訂單</span><div class="metric mt12">31 <small>筆</small></div><span class="footnote">31 / 128 = 24.2%</span></div><div class="card"><span class="small muted">明確時間限制</span><div class="metric mt12">18 <small>件</small></div><span class="footnote">來自客戶直接陳述</span></div><div class="card"><span class="small muted">未成交原因未知</span><div class="metric mt12">58 <small>件</small></div><span class="footnote">不推定為價格問題</span></div></div><div class="board-grid"><div class="stack"><div class="card soft focusmark">${mark(1)}<div class="between mb12"><div class="eyebrow">值得討論 · PR-008</div>${tag('待驗證假說','amber')}</div><h1 style="font-size:23px">是否新增六十分鐘品飲？</h1><p class="muted small mt12">18 件詢問明確表示停留時間不超過一小時；目前只有九十分鐘方案。<br>這是可討論的需求訊號，不代表短版已被證明會賺錢。</p><div class="grid g2 mt16"><div class="statustile"><strong>保留原方案</strong><p class="footnote mt12">不直接縮短內容，不改舊訂單承諾。</p></div><div class="statustile"><strong>另設短版並小範圍試行</strong><p class="footnote mt12">先確認內容、價格與共用資源。</p></div></div><div class="row mt16">${b('與經營者討論 '+icon('arrow'),'go:proposal','primary')}${b('檢查來源案件','evidence')}</div></div><div class="card"><h2 class="mb16">97 件未成交案件的已知與未知</h2>${[['時間限制',18],['語言接待',9],['明確價格考量',12],['原因未知',58]].map(([s,n])=>`<div class="barrow"><span>${s}</span><div class="bartrack"><div class="barfill" style="width:${n/58*100}%;${s==='原因未知'?'background:#bdc7c6':''}"></div></div><strong>${n}</strong></div>`).join('')}<div class="footnote">本示例使用互斥分類：18 + 9 + 12 + 58 = 97。未知原因不被自動歸類。</div></div></div><div class="stack"><div class="card"><h2 class="mb16">其他觀察</h2><h3>接待語言需要更清楚</h3><p class="small muted mt12">9 件詢問有語言疑慮；1 件客訴已確認原渠道描述有落差。</p>${b('查看相關客訴','go:complaint','full mt16')}<div class="separator"></div><h3>合作頁仍有舊版本</h3><p class="small muted mt12">先確定實際更新完成，再比較新版本的交易。</p>${b('查看渠道狀態','go:channels','full mt16')}</div><div class="card focusmark">${mark(2)}<h3>判斷改善結果</h3><p class="small muted mt12">完成訂單、可核對收益、人工時間與再客訴一起看。沒有足夠對照時，顯示關聯與未知，不宣稱因果。</p><div class="separator"></div><span class="footnote">查詢版本：INSIGHT-DEMO-v1<br>來源：合成案件資料，不是實際營運數據。</span></div></div></div>`}
function proposal(){return heading('SERVICE DESIGN · PR-008','與經營者，把新服務談具體。','保留九十分鐘原方案；新增版本先確認內容、資源與素材。',b('查看觀察依據','evidence')+b('索取缺少素材','go:assets','primary'))+`<div class="grid" style="grid-template-columns:minmax(0,1fr) 400px"><div class="card"><div class="row mb20"><span class="avatar ai">助</span><div><h2>經營討論</h2><span class="tiny muted">管理工作區 · 不是對客戶的聊天</span></div></div><div class="chatline"><span class="avatar ai">助</span><div class="grow"><div class="chatmeta">接單助理 · 附資料來源</div><div class="bubble">有 18 件詢問明確提到只有一小時。原方案需要九十分鐘，是否值得另做一個短版？不建議直接刪減原服務。</div></div></div><div class="chatline mine"><span class="avatar">林</span><div class="grow"><div class="chatmeta">示例經營者</div><div class="bubble owner">可以另外做六十分鐘品飲，兩款茶，不含完整沖泡實作。每人 980 元，12 歲以上。</div></div></div><div class="chatline"><span class="avatar ai">助</span><div class="grow"><div class="chatmeta">接單助理</div><div class="bubble">已整理成草案，原方案與既有訂單都保留。<br>短版會與原方案共用同一位講師與座位，因此不能把時段重複出售。</div></div></div><div class="chatline mine"><span class="avatar">林</span><div class="grow"><div class="bubble owner">先放官網和合作旅宿頁，外部平台先不要上。</div></div></div><div class="chatline"><span class="avatar ai">助</span><div class="grow"><div class="bubble">收到。還缺現場照片與新版說明卡。我會沿用已核准素材，只向你索取這次需要補的內容。</div></div></div>${state.ownerReply?`<div class="chatline mine"><div class="bubble owner">${esc(state.ownerReply)}</div></div><div class="callout">此內容已加入示範討論，尚未修改任何正式商品。</div>`:''}<div class="composer"><input id="ownerMessage" aria-label="經營者討論訊息" placeholder="補充內容或條件，也可以提供語音素材…">${b(icon('send'),'send-owner','primary sm')}</div><div class="row wrap mt12">${b('模擬語音說明','owner-voice','sm')}${b('提供素材','go:assets','sm')}${b('查看手機操作','go:owner','sm')}</div></div><div class="stack"><div class="card focusmark">${mark(1)}<div class="between mb12"><h2>服務草案</h2>${tag('尚未核准','amber')}</div><h3>新增｜六十分鐘品飲</h3>${dl('價格','每人 NT$ 980')}${dl('適用對象','12 歲以上')}${dl('包含','兩款茶比較、品飲說明')}${dl('不包含','完整沖泡實作')}${dl('現場語言','中文示範＋英文說明卡')}${dl('銷售範圍','官網、合作旅宿頁')}<div class="callout mt12">原九十分鐘方案保留。核准綁定具體版本與發布渠道，不能被拿來執行其他內容。</div></div><div class="card focusmark">${mark(2)}<h3 class="mb12">在核准前補齊</h3><div class="minirow"><span>共用講師與座位</span>${tag('已標示','green')}</div><div class="minirow"><span>新版照片與說明</span>${tag(state.assetReady?'已核准':'待補件',state.assetReady?'green':'amber')}</div><div class="minirow"><span>材料及人力成本</span>${tag('尚未輸入')}</div><p class="footnote mt12">成本未知時不計算獲利預估；不影響先整理草案與取得必要素材。</p>${b('進入版本審閱','go:review','full mt16')}</div></div></div>`}
function assettile(name,type,ok){return `<div class="assetbox"><div class="assetvisual">${icon(type)}</div><div class="assetbody"><strong class="small">${name}</strong><div class="between mt12">${tag(ok?'可使用':'待權利確認',ok?'green':'amber')}<span class="tiny muted">示例素材</span></div></div></div>`}
function assets(){return heading('MATERIAL REQUEST · MR-008','只請店家補上這次缺少的素材。','文字、語音、圖片與文件都綁定同一提案；收到不等於可公開。',b('主管手機補件','go:owner')+b('返回提案','go:proposal'))+`<div class="grid" style="grid-template-columns:minmax(0,1fr) 365px"><div class="stack"><div class="card soft focusmark">${mark(1)}<div class="row mb12"><span class="avatar ai">助</span><h2>給經營者的素材請求</h2></div><p>「請提供實際品飲操作與完成擺設的照片，以及六十分鐘版本的英文說明卡。原有空間圖可以沿用，不用重傳。」</p><div class="row wrap mt16">${tag('用途：新版商品與訂後說明')}${tag('渠道：官網、合作旅宿頁')}${tag('不含外部 OTA')}</div></div><div class="card"><div class="between mb16"><h2>本次素材</h2>${tag(state.assetReady?'已具備發布用途':'尚待補齊',state.assetReady?'green':'amber')}</div><div class="grid g3">${assettile('既有空間示意','tea',true)}${assettile(state.assetReceived?'品飲操作示意':'待補：品飲操作','image',state.assetReady)}${assettile(state.assetReceived?'英文說明卡示意':'待補：英文說明卡','file',state.assetReady)}</div><div class="dropzone mt16"><div class="row" style="justify-content:center;margin-bottom:8px">${icon('upload')}<strong>直接提供，不用重新填資料庫</strong></div><p class="footnote mb12">原型檔案只留在此瀏覽器，不會上傳到任何伺服器。</p><div class="row" style="justify-content:center">${b('載入示範素材','sample-assets','primary')}${b('從裝置選擇檔案','pick-files')}</div><input id="fileInput" type="file" accept="image/*,audio/*,video/*,application/pdf" multiple hidden>${state.uploads.length?`<p class="small mt12">已選取：${state.uploads.map(esc).join('、')}<br><span class="muted tiny">尚未檢查，不代表真實發布授權。</span></p>`:''}</div></div></div><div class="stack"><div class="card focusmark">${mark(2)}<h2 class="mb16">來源與用途確認</h2>${dl('適用服務','PR-008 · 六十分鐘品飲')}${dl('原始提供者','示例商家經營者')}${dl('允許渠道','自有網站、合作旅宿頁')}${dl('使用範圍','本提案商品與說明')}${dl('不包含','客訴附件、其他商家、廣告素材')}<div class="separator"></div><label class="check"><input id="assetRights" type="checkbox" ${state.assetRights?'checked':''}><span>示範：經營者已確認素材來源、公開使用範圍與必要人物／作品權利。</span></label>${b(state.assetReady?'素材已核准可用':'確認素材用途（示範）','approve-assets','primary full mt16',!state.assetReceived||!state.assetRights||state.assetReady)}<p class="footnote mt12">本畫面的勾選只示範核准流程，不產生任何真實權利授權。</p></div><div class="card"><h3 class="mb12">下一步</h3><p class="small muted">素材可用後，助理準備商品差異、語言與渠道範圍，經營者只需要審閱並核准。</p>${b('審閱服務版本','go:review','full mt16')}</div></div></div>`}
function review(){return heading('APPROVAL · PR-008','核准的是具體變更，不是一句「可以」。','價格、內容、資源與渠道一起審閱；已成交訂單維持原承諾。',b('模擬版本衝突','conflict')+b('返回補件','go:assets'))+`${state.conflict?'<div class="callout red mb20"><strong>原系統版本已變更 · 409 示範</strong><br>另一位店員修改了服務內容。原核准不可套用，請載入差異後重新審閱。 '+b('載入最新差異','reload-version','sm')+'</div>':''}<div class="grid" style="grid-template-columns:minmax(0,1fr) 350px"><div class="stack"><div class="card nopad focusmark">${mark(1)}<div class="cardhead between"><h2>服務版本比較</h2><div class="row">${tag('目前 v'+state.baseVersion)}${icon('arrow')}${tag('草案 v'+state.targetVersion,'green')}</div></div><table><thead><tr><th style="width:120px">檢查項目</th><th>目前版本</th><th>本次變更</th></tr></thead><tbody><tr><td>原有服務</td><td>九十分鐘茶體驗</td><td>保留，不修改舊訂單</td></tr><tr><td>新增選項</td><td>無</td><td><div class="diffcell">六十分鐘品飲 · 12 歲以上</div></td></tr><tr><td>新品售價</td><td>不適用</td><td><div class="diffcell">NT$ 980／人 · TWD</div></td></tr><tr><td>新品內容</td><td>不適用</td><td><div class="diffcell">兩款茶比較；不含完整沖泡實作</div></td></tr><tr><td>現場語言</td><td>中文示範＋英文說明卡</td><td>維持；不宣稱有英文講師</td></tr><tr><td>共用資源</td><td>原預約系統管理</td><td>同一講師與座位池，先檢查衝突</td></tr><tr><td>發布範圍</td><td>既有渠道不變</td><td><div class="diffcell">本次只更新官網＋合作旅宿頁</div></td></tr></tbody></table></div><div class="card"><h3 class="mb12">核准後，助理接著執行</h3><div class="row wrap"><span class="stepnum">1</span><span class="small">建立不可變新版</span>${icon('arrow')}<span class="stepnum">2</span><span class="small">建立各渠道工作</span>${icon('arrow')}<span class="stepnum">3</span><span class="small">查核實際生效</span></div><p class="footnote mt16">核准不會追溯改舊單。外部審核仍在進行時，系統保留工作與責任，不回覆全部完成。</p></div></div><div class="stack"><div class="card focusmark">${mark(2)}<h2 class="mb16">核准檢查</h2><div class="minirow"><span>新內容與售價</span>${tag('已整理','green')}</div><div class="minirow"><span>共用資源</span>${tag('已標示','green')}</div><div class="minirow"><span>素材用途</span>${tag(state.assetReady?'已確認':'待補確認',state.assetReady?'green':'amber')}</div><div class="minirow"><span>原版本一致</span>${tag(state.conflict?'有衝突':'符合',state.conflict?'red':'green')}</div><div class="minirow"><span>舊訂單不變</span>${tag('已保留','green')}</div><div class="callout mt16">核准版本：v${state.targetVersion}<br>渠道：自有官網、合作旅宿頁<br>本原型只建立模擬工作，不修改真實資料。</div><label class="check mt16"><input id="approvalAck" type="checkbox" ${state.proposalApproved?'checked disabled':state.approvalAck?'checked':''}><span>已審閱本次內容、價格、資源及兩個渠道，授權此版本執行。</span></label>${b(state.proposalApproved?'已建立發布工作':'核准並建立發布工作','approve-proposal','primary full mt16',!state.assetReady||state.conflict||!state.approvalAck||state.proposalApproved)}${!state.assetReady?'<p class="footnote mt12">先到素材頁載入示範素材並核准用途，才能完成此流程。</p>':''}</div><div class="card"><h3 class="mb12">不是獲利保證</h3><p class="small muted">材料與人力成本尚未輸入。本次核准是服務試行，不等於系統已證明短版更有利潤。</p></div></div></div>`}
function channels(){let st=state.publication;let live=st==='done';let started=st!=='draft';return heading('CHANNEL OPERATIONS','每個渠道，看到真正的發布結果。','核准、送出、已生效是不同階段。原型中僅兩個渠道在本次範圍。',b('核准內容','go:review')+b('核對待驗證工作','verify-publish','primary',st!=='review'))+`<div class="grid g3 mb20"><div class="card"><span class="small muted">本次變更</span><h2 class="mt12">新增六十分鐘品飲</h2><span class="footnote">PR-008 · v${state.targetVersion} · 不影響舊訂單</span></div><div class="card"><span class="small muted">已驗證生效</span><div class="metric mt12">${live?'2':started?'1':'0'} <small>/ 2 個選定渠道</small></div><span class="footnote">不把 API 收件當上線</span></div><div class="card"><span class="small muted">需要接續</span><h2 class="mt12">${live?'發布結果已核對':started?'合作旅宿頁待處理':'等待經營者核准'}</h2><span class="footnote">${live?'後續訂單沿用正確版本':'工作仍保留，不需要重新建案'}</span></div></div>${started&&!live?'<div class="callout amber mb20"><strong>部分完成：</strong>官網已生效；合作旅宿頁尚未通過讀回驗證。未生效渠道仍顯示舊版，不宣稱已同步完成。</div>':''}<div class="card nopad focusmark">${mark(1)}<div class="cardhead between"><h2>商品與渠道版本</h2>${tag(started?'核准範圍已鎖定':'尚未核准',started?'green':'amber')}</div><div class="tablewrap"><table><thead><tr><th>渠道／方式</th><th>希望發布</th><th>已送出</th><th>已觀測生效</th><th>狀態</th><th>下一步</th></tr></thead><tbody><tr><td><strong>自有官網</strong><br><span class="tiny muted">正式接口 · 可讀回（示例）</span></td><td>v${state.targetVersion}</td><td>${started?'v'+state.targetVersion:'—'}</td><td>${started?'v'+state.targetVersion:'v'+state.baseVersion}</td><td>${tag(started?'已驗證生效':'等待核准',started?'green':'')}</td><td>${b('查看證據','publication-evidence','sm')}</td></tr><tr><td><strong>合作旅宿頁</strong><br><span class="tiny muted">授權發布接口（示例）</span></td><td>v${state.targetVersion}</td><td>${started?'v'+state.targetVersion:'—'}</td><td>${live?'v'+state.targetVersion:'v'+state.baseVersion}</td><td>${tag(live?'已驗證生效':st==='review'?'等待審核／驗證':started?'已知發布失敗':'等待核准',live?'green':started?'amber':'')}</td><td>${b(st==='review'?'核對結果':'重試已確認失敗項目',st==='review'?'verify-publish':'retry-publish','sm',!started||live)}</td></tr><tr><td><strong>外部平台 A</strong><br><span class="tiny muted">未選入本次更新</span></td><td>維持 v${state.baseVersion}</td><td>未送出</td><td>v${state.baseVersion}</td><td>${tag('本次未授權')}</td><td>${b('查看能力','go:connections','sm')}</td></tr></tbody></table></div></div><div class="grid g2 mt16"><div class="card focusmark">${mark(2)}<h2 class="mb16">執行紀錄</h2><div class="timeline"><div class="event ${started?'good':''}"><strong>${started?'經營者已核准具體版本':'等待核准 PR-008'}</strong><div class="muted">核准包含價格、素材、渠道與舊單不變。</div></div><div class="event ${started?'good':''}"><strong>各渠道獨立執行</strong><div class="muted">官網成功不代表其他渠道已完成。</div></div><div class="event ${live?'good':'warn'}"><strong>${live?'兩個選定渠道都已讀回確認':'未完成項目保留負責人與下一步'}</strong><div class="muted">${live?'示例觀測：v'+state.targetVersion:'失敗重試與結果核對分開，不重建商品。'}</div></div></div></div><div class="card"><h2 class="mb16">同步能力與訂單</h2><div class="minirow"><span>商品內容／價格</span><span>依個別接口驗證</span></div><div class="minirow"><span>場次與容量</span><span>原預約系統為準</span></div><div class="minirow"><span>訂後通知</span><span>依訂單指定主體</span></div><div class="minirow"><span>已成交訂單</span><span>維持成交快照</span></div>${b('查看訂單接續','go:orders','full mt16')}</div></div>`}

function connections(){return heading('CONNECTED WORKFLOWS','助理協作，原工具照常工作。','逐項確認讀取、操作與回寫能力；不以「已連線」代表全部支援。',b(state.connectionDown?'恢復模擬連線':'模擬預約來源中斷','connection-toggle',state.connectionDown?'primary':''))+`${state.connectionDown?'<div class="callout red mb20">預約來源暫時中斷：停止新的交易寫入，已成立訂單與工作進度保留。以下僅為故障狀態演示。</div>':''}<div class="grid g2"><div class="card focusmark">${mark(1)}<div class="between mb16"><div class="row"><span class="avatar">預</span><div><h2>原預約系統 A</h2><span class="tiny muted">沙盒示意 · 商品與庫存的主要來源</span></div></div>${tag(state.connectionDown?'來源中斷':'可用',state.connectionDown?'red':'green')}</div><div class="capgrid"><div class="minirow"><span>商品讀取</span>${tag('已驗證','green')}</div><div class="minirow"><span>可售查詢</span>${tag('已驗證','green')}</div><div class="minirow"><span>建立預訂</span>${tag('已驗證','green')}</div><div class="minirow"><span>新增商品</span>${tag('未提供')}</div><div class="minirow"><span>正式查單</span>${tag('已驗證','green')}</div><div class="minirow"><span>取消／退款</span>${tag('個別驗證','amber')}</div></div><div class="callout mt16">平台只查詢與接續，不建立與原系統競爭的庫存。</div>${b('查看測試結果','connector-test','full mt16')}</div><div class="card"><div class="between mb16"><div class="row"><span class="avatar">客</span><div><h2>商家原客服工作區</h2><span class="tiny muted">訊息與真人指派保留在原工具</span></div></div>${tag('協作中','green')}</div>${dl('收件責任','原客服工具')}${dl('助理接入','經授權事件轉送')}${dl('回覆控制','單一案件負責人')}${dl('真人接手','停止尚未送出的 AI 回覆')}<div class="callout mt12">LINE 語音附件與原生電話是不同入口；本原型沒有啟用實際通話。</div>${b('查看接手介面','go:inbox','full mt16')}</div><div class="card"><div class="between mb16"><h2>原金流／銷售系統</h2>${tag('模擬環境','blue')}</div>${dl('正式結果','回呼驗證＋查詢')}${dl('付款頁','原收款方安全付款頁')}${dl('退款','原路徑，狀態單獨追蹤')}<p class="footnote mt16">原型不收卡號、不開啟支付頁、不測試真實退款。</p>${b('查看客訴退款','go:complaint','full mt16')}</div><div class="card focusmark">${mark(2)}<div class="between mb16"><h2>渠道權限</h2>${tag('依商品與動作授權')}</div>${dl('自有網站','可發布／可讀回')}${dl('合作旅宿頁','可送出／需核對生效')}${dl('外部平台 A','本次新品未授權')}<div class="callout amber mt12">訂單同步權，不等於商品與價格修改權。每項能力分開測試。</div>${b('查看發布狀態','go:channels','full mt16')}</div></div>`}
function phoneTop(title,back='customer'){return `<div class="phone-status"><span>9:41</span><span>◕ ▰</span></div><div class="phone-nav"><button class="btn ghost sm" data-go="${back}" aria-label="返回">${icon('back')}</button><strong>${title}</strong><span class="grow"></span>${tag('示例')}</div><div class="phone-demo">原型 Demo · 不錄音、不付款／No live transaction</div>`}
function customer(){let en=state.lang==='en';return phoneTop(en?'Shanxu Tea · Demo':'山序茶事 · 旅客服務')+`<div class="phone-body"><div class="between mb12"><div class="eyebrow">TAIWAN · LOCAL EXPERIENCE</div>${b(en?'繁中':'English','language','sm')}</div><div class="hero-illustration">${icon('tea')}<small>介面示意圖 · 非店家實拍</small></div><h1>${en?'A tea experience you can take part in.':'不只喝茶，\n親手感受風味的差異。'.replace('\n','<br>')}</h1><p class="subtitle mt12">${en?'90 minutes · guided tasting and hands-on practice.':'90 分鐘 · 比較品飲與沖泡實作。先確認適合，再放心預訂。'}</p><div class="row wrap mt16">${tag(en?'From NT$ 1,500 / adult':'成人 NT$ 1,500 起','green')}${tag(en?'Taipei · Taiwan time':'台北 · 台灣時間')}</div><div class="callout mt16">${en?'Mandarin demonstration with an English guide card. This is not a fully English-led session.':'現場中文示範，提供英文說明卡。不是全程英文講師服務。'}</div>${state.mobileVoice?`<div class="card mt16"><div class="between"><h3>語音流程示意</h3>${tag('未開麥克風')}</div><div class="wave" style="height:47px">${[15,27,40,23,36,19,33,24,15].map(h=>`<span style="height:${h}px"></span>`).join('')}</div><p class="small">「12 月 5 日下午，兩位大人與一位 8 歲孩子，可以嗎？」</p><p class="footnote mt12">助理：先確認日期、人數與現場語言，再查正式價格與名額。</p></div>`:''}<div class="grid g2 mt16" style="grid-template-columns:1fr 1fr"><div class="field"><label>${en?'Date':'日期'}</label><input type="date" id="travelDate" value="2026-12-05" aria-label="服務日期"></div><div class="field"><label>${en?'Party':'參加人數'}</label><select id="party" aria-label="參加人數"><option value="1" ${state.children===1?'selected':''}>${en?'2 adults + 1 child':'2 成人＋1 兒童'}</option><option value="2" ${state.children===2?'selected':''}>${en?'2 adults + 2 children':'2 成人＋2 兒童'}</option></select></div></div><p class="footnote mt12">${en?'Your preference does not reserve capacity. A formal quote follows.':'選擇條件不等於已保留名額。下一步才查詢正式報價。'}</p></div><div class="phone-footer"><div class="row">${b(icon('mic')+(en?'Ask by voice':'語音詢問'),'mobile-voice')}${b((en?'Check availability':'查詢可售與報價')+icon('arrow'),'customer-quote','primary grow')}</div></div>`}
function quote(){if(state.lang==='en')return quoteEN();let sum=state.adults*1500+state.children*900;return phoneTop('確認預約內容','customer')+`<div class="phone-body"><div class="between mb12"><span class="eyebrow">QUOTE · Q-026 / REV.${state.quoteRev}</span>${tag(state.quoteExpired?'報價已失效':'正式報價',state.quoteExpired?'red':'green')}</div><h1>九十分鐘茶體驗</h1><p class="subtitle">銷售方：示例旅行社 · 履約：示例商家</p>${state.quoteExpired?'<div class="callout red mt16">報價已過期或條件改變。請重新查詢，不沿用舊金額直接付款。</div>':''}<div class="card mt16 focusmark">${mark(1)}${dl('日期','2026/12/05（六）')}${dl('時間','14:00–15:30')}${dl('時區','台灣 · Asia/Taipei')}${dl('參加者',`2 成人、${state.children} 兒童`)}${dl('孩子年齡',state.children===1?'8 歲':'8 歲、6 歲')}${dl('現場接待','中文示範＋英文說明卡')}</div><div class="mt16">${dl('成人','2 × NT$ 1,500')}${dl('兒童',`${state.children} × NT$ 900`)}<div class="separator"></div><div class="between"><strong>含稅總價</strong><span class="metric">${money(sum)}</span></div><p class="footnote right">實際扣款幣別：TWD</p></div><div class="callout mt16">本例取消條件：活動開始 48 小時前可全額取消；其後依商品正式條款。此為示範條款。</div><label class="check mt16 focusmark">${mark(2)}<input id="customerConsent" type="checkbox" ${state.customerConsent?'checked':''} ${state.quoteExpired?'disabled':''}><span>已確認日期、人數、現場語言、含稅總額與取消條件。這次確認只適用於本報價。</span></label><p class="footnote mt12">你可以在安全付款頁完成購買；不要在聊天或電話中提供卡號與安全碼。</p></div><div class="phone-footer">${b(state.quoteExpired?'重新查詢報價':'確認並進入付款（示範）',state.quoteExpired?'refresh-quote':'customer-pay','primary full',!state.quoteExpired&&!state.customerConsent)}<div class="between mt12">${b('修改人數','go:customer','ghost sm')}${b('模擬報價過期','expire','ghost sm')}</div></div>`}
function receipt(){if(state.lang==='en')return receiptEN();let done=state.booking==='confirmed';return phoneTop('我的訂單','quote')+`<div class="phone-body"><div class="row mb16"><span class="avatar ai">${icon(done?'check':'clock')}</span><div><h1 style="font-size:23px">${orderStatus()}</h1><span class="tiny muted">ORD-1205-024 · 示範訂單</span></div></div><div class="callout ${done?'':'amber'}">${done?'供應與付款已核對。通知已送出，訂單可在此查詢。':state.payment==='paid'?'款項已核對，正在查詢供應結果。現在還不能視為訂妥，也不會要求你再付一次。':'尚未完成確認與付款。你可以返回正式報價頁繼續。'}</div><div class="card mt16">${dl('服務','九十分鐘茶體驗')}${dl('日期','2026/12/05 14:00')}${dl('地點時區','台灣 · Asia/Taipei')}${dl('人數',`2 成人、${state.children} 兒童`)}${dl('訂單金額',money(state.adults*1500+state.children*900))}</div><div class="card mt16 focusmark">${mark(1)}<h3 class="mb12">分開顯示每個結果</h3><div class="minirow"><span>付款</span>${tag(state.payment==='paid'?'已核對收款':'尚未付款',state.payment==='paid'?'green':'')}</div><div class="minirow"><span>供應預訂</span>${tag(done?'已確認':state.payment==='paid'?'結果核對中':'尚未送出',done?'green':'amber')}</div><div class="minirow"><span>確認通知</span>${tag(done?'已送出':'待訂妥後發送',done?'green':'')}</div></div>${done?'<div class="card mt16"><h3 class="mb12">到場前提醒</h3><p class="small">請提早 10 分鐘報到。現場中文示範並提供英文說明卡；請保留此訂單編號。</p></div>':'<p class="footnote mt16">離開頁面不會取消已送出的交易。再次查詢同一訂單，不會重新下單。</p>'}</div><div class="phone-footer">${b(done?'提出查詢／改期需求':state.payment==='paid'?'查核預訂結果（示範）':'返回報價頁',done?'customer-service':state.payment==='paid'?'verify-order':'go:quote','primary full')}${done?b('查看商家接單畫面','go:orders','full mt12'):''}</div>`}
function owner(){return phoneTop('接單助理 · 經營者','owner')+`<div class="phone-body"><div class="row mb16"><span class="avatar ai">助</span><div><h2>六十分鐘品飲，請你審閱</h2><span class="tiny muted">管理身分：示例經營者 · PR-008</span></div></div><div class="bubble">內容與渠道已整理好。我只需要你補上缺少素材，再確認正式版本。核准後由助理接著發布，不需你重複到各處修改。</div><div class="card mt16"><div class="between mb12"><h3>本次還缺什麼？</h3>${tag(state.assetReady?'已齊備':'待補件',state.assetReady?'green':'amber')}</div><div class="minirow"><span>操作過程與完成品</span>${tag(state.assetReceived?'已收到':'待提供')}</div><div class="minirow"><span>英文說明卡</span>${tag(state.assetReceived?'已收到':'待提供')}</div><div class="minirow"><span>素材用途核准</span>${tag(state.assetReady?'已核准':'待確認',state.assetReady?'green':'amber')}</div>${b('補交素材（示範）','mobile-material','full mt16')}</div><div class="card mt16 focusmark">${mark(1)}<div class="between mb12"><h3>版本 v${state.targetVersion} 變更摘要</h3>${tag('新方案')}</div>${dl('時長／價格','60 分鐘／NT$ 980 每人')}${dl('參加條件','12 歲以上')}${dl('內容','兩款茶品飲，不含完整實作')}${dl('渠道','官網＋合作旅宿頁')}${dl('共用資源','同一講師與座位池')}<div class="callout mt12">原九十分鐘服務及已成交訂單不變。材料成本未知，不宣稱已證明獲利。</div></div>${state.proposalApproved?'<div class="callout mt16">核准已記錄。渠道執行工作已建立，等待各渠道正式結果；不把已送出當全部完成。</div>':''}</div><div class="phone-footer">${b(state.proposalApproved?'查看發布進度':'審閱並核准版本',state.proposalApproved?'mobile-publish':'mobile-approve','primary full',!state.assetReady&&!state.proposalApproved)}<p class="footnote mt12">${state.assetReady?'本次核准只適用 v'+state.targetVersion+' 與上列兩個渠道。':'先完成素材用途確認，核准按鈕才可使用。'}</p></div>`}

function quoteEN(){let sum=3000+state.children*900;return phoneTop('Review your booking','customer')+`<div class="phone-body"><div class="between mb12"><span class="eyebrow">QUOTE · Q-026 / REV.${state.quoteRev}</span>${tag(state.quoteExpired?'Expired':'Official quote',state.quoteExpired?'red':'green')}</div><h1>90-minute tea experience</h1><p class="subtitle">Sold by: Demo travel agency<br>Hosted by: Demo merchant</p>${state.quoteExpired?'<div class="callout red mt16">This quote has expired. Refresh it before confirming or paying.</div>':''}<div class="card mt16">${dl('Date','Sat, 5 Dec 2026')}${dl('Time','14:00–15:30')}${dl('Time zone','Taiwan · Asia/Taipei')}${dl('Guests',`2 adults + ${state.children} child${state.children>1?'ren':''}`)}${dl('Child age',state.children===1?'8 years':'8 and 6 years')}</div><div class="callout mt16">Mandarin demonstration with an English guide card. No full English-language instructor.</div><div class="mt16">${dl('Adults','2 × NT$ 1,500')}${dl('Children',`${state.children} × NT$ 900`)}<div class="separator"></div><div class="between"><strong>Total incl. tax</strong><span class="metric">${money(sum)}</span></div><p class="footnote right">Charged in TWD</p></div><div class="callout mt16">Demo policy: full cancellation refund at least 48 hours before the activity. This is sample content, not a live offer.</div><label class="check mt16"><input id="customerConsent" type="checkbox" ${state.customerConsent?'checked':''} ${state.quoteExpired?'disabled':''}><span>I have checked the date, guests, service language, total and cancellation policy for this quote.</span></label></div><div class="phone-footer">${b(state.quoteExpired?'Refresh quote':'Continue to payment · Demo',state.quoteExpired?'refresh-quote':'customer-pay','primary full',!state.quoteExpired&&!state.customerConsent)}<div class="between mt12">${b('Edit guests','go:customer','ghost sm')}${b('Simulate expiry','expire','ghost sm')}</div></div>`}
function receiptEN(){let done=state.booking==='confirmed';return phoneTop('Your booking','quote')+`<div class="phone-body"><div class="row mb16"><span class="avatar ai">${icon(done?'check':'clock')}</span><div><h1 style="font-size:23px">${done?'Booking confirmed':state.payment==='paid'?'Confirming booking':'Payment needed'}</h1><span class="tiny muted">ORD-1205-024 · Demo</span></div></div><div class="callout ${done?'':'amber'}">${done?'Payment and the supplier booking have been checked. Your confirmation is available.':state.payment==='paid'?'Payment has been verified, but the supplier booking is not confirmed yet. Do not pay again.':'Return to your quote to review and continue.'}</div><div class="card mt16">${dl('Experience','90-minute tea session')}${dl('Date','5 Dec 2026 · 14:00')}${dl('Time zone','Asia/Taipei')}${dl('Guests',`2 adults + ${state.children} child${state.children>1?'ren':''}`)}${dl('Amount',money(3000+state.children*900))}</div><div class="card mt16"><h3 class="mb12">Each result is tracked separately</h3><div class="minirow"><span>Payment</span>${tag(state.payment==='paid'?'Verified':'Not paid',state.payment==='paid'?'green':'')}</div><div class="minirow"><span>Supplier booking</span>${tag(done?'Confirmed':'Pending',done?'green':'amber')}</div><div class="minirow"><span>Confirmation</span>${tag(done?'Sent':'Not sent',done?'green':'')}</div></div><p class="footnote mt16">Leaving this page does not cancel an existing booking. Checking again will not create a second order.</p></div><div class="phone-footer">${b(done?'Ask about this booking':state.payment==='paid'?'Simulate supplier verification':'Return to quote',done?'customer-service':state.payment==='paid'?'verify-order':'go:quote','primary full')}</div>`}

const renderers={work,inbox,voice,orders,complaint,insights,proposal,assets,review,channels,finance,connections};
function mobileWrap(){const titles={customer:['旅客端｜發現與詢問','讓旅客看懂值得做什麼，再用文字或語音確認是否適合。'],quote:['旅客端｜正式確認','日期、人數、現場語言、總價與取消條件，同一頁清楚確認。'],receipt:['旅客端｜訂單進度','付款、供應預訂、通知分開顯示，不以成功頁冒充訂妥。'],owner:['商家手機｜素材與核准','經營者補充專業和決策，助理負責整理與後續執行。']};let [t,s]=titles[route];let fn={customer,quote,receipt,owner}[route];return `<div class="mobile-stage"><div class="mobile-note"><div class="eyebrow">${PAGE()[1]} / MOBILE EXPERIENCE</div><h1>${t}</h1><p class="muted">${s}</p><div class="separator"></div><div class="note-step"><span class="stepnum">1</span><div><strong>請實際點擊操作</strong><p>按鈕會改變本機模擬狀態。無連線、無錄音、無真實付款。</p></div></div><div class="note-step"><span class="stepnum">2</span><div><strong>檢查過程，不只看結果</strong><p>待確認、報價失效、發布中等狀態都有不同的下一步。</p></div></div><div class="note-step"><span class="stepnum">3</span><div><strong>手機與桌機共用案件</strong><p>回到商家畫面可查看這次示範交易或核准結果。</p></div></div>${b('回商家工作台','go:work','full mt24')}</div><div class="phone">${fn()}</div><div class="mobile-note"><h3 class="mb16">這組原型的接續畫面</h3>${[['customer','旅客發掘與語音'],['quote','正式報價與同意'],['receipt','付款與預訂結果'],['owner','商家手機補件與核准']].map(p=>`<a class="screenlink" href="#${p[0]}" data-go="${p[0]}">${p[1]} ${icon('arrow')}</a>`).join('')}<div class="callout mt24">SA 對照：${PAGE()[3]}<br>所有人物、金額、素材與狀態均為示例。</div></div></div>`}
function render(){if(!PAGES.some(p=>p[0]===route))route='work';document.body.classList.toggle('wireframe',wire);document.body.classList.toggle('annotations',annotations);document.title=PAGE()[1]+' '+PAGE()[2]+'｜商家接單助理原型';document.getElementById('app').innerHTML=controls()+(renderers[route]?`<div class="layout">${nav()}${topbar()}<main class="main">${renderers[route]()}${metaFoot()}</main></div>`:mobileWrap());bindFields()}
function bindFields(){let q=id=>document.getElementById(id);if(q('pageSelect'))q('pageSelect').onchange=e=>go(e.target.value);if(q('workFilter'))q('workFilter').onchange=e=>{state.casesFilter=e.target.value;render()};for(const [id,key] of [['refundConsent','refundConsent'],['assetRights','assetRights'],['customerConsent','customerConsent'],['customerAccepted','customerAccepted'],['approvalAck','approvalAck']])if(q(id))q(id).onchange=e=>{state[key]=e.target.checked;render()};if(q('party'))q('party').onchange=e=>{state.children=Number(e.target.value);state.demandRev++;state.customerConsent=false};if(q('travelDate'))q('travelDate').onchange=e=>{e.target.value='2026-12-05';toast('示範場次固定為 2026/12/05；正式產品依可售查詢提供日期。')};if(q('fileInput'))q('fileInput').onchange=e=>{state.uploads=Array.from(e.target.files).map(x=>x.name);state.assetReceived=true;render();toast('已在此瀏覽器選取素材，未上傳或公開。')};for(const id of ['caseMessage','ownerMessage'])if(q(id))q(id).onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();act(id==='caseMessage'?'send-case':'send-owner')}}}
function toast(s){document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.role='status';n.textContent=s;document.body.appendChild(n);document.getElementById('announcer').textContent=s;setTimeout(()=>n.remove(),3200)}
function modal(title,content,footer='',wide=false){modalReturn=document.activeElement;document.getElementById('overlay').innerHTML=`<div class="modalback"><section class="modal ${wide?'modalwide':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="between mb20"><h2 id="dialog-title">${title}</h2><button class="btn ghost sm" data-act="close" aria-label="關閉對話框">${icon('close')}</button></div>${content}<div class="modalfooter">${footer||b('知道了','close','primary')}</div></section></div>`;setTimeout(()=>document.querySelector('.modal button, .modal input')?.focus(),0)}
function closeModal(){document.getElementById('overlay').innerHTML='';if(modalReturn&&document.contains(modalReturn))modalReturn.focus()}
function approve(){state.proposalApproved=true;state.publication='partial';closeModal();go('channels');toast('已建立兩個模擬發布工作。請逐渠道核對實際生效。')}
function act(a){if(a.startsWith('go:')){closeModal();go(a.slice(3));return}switch(a){case'wire':wire=!wire;render();break;case'annotations':annotations=!annotations;render();break;case'reset':state=base();closeModal();go('work');toast('示範已重設。所有交易仍為本機模擬。');break;case'close':closeModal();break;case'guide':modal('用三條流程，檢查這位助理是否真的會做事。',`<div class="stack"><div class="card"><h3>01｜語音詢問 → 正式報價 → 預訂結果</h3><p class="small muted mt12">先看改口使舊報價失效，再從旅客頁確認及模擬付款，最後核對供應。</p>${b('從語音接單開始','go:voice','primary mt16')}</div><div class="card"><h3>02｜客訴 → 政策內退款 → 結案</h3><p class="small muted mt12">核對原承諾，記錄客戶接受後退款；退款完成仍不直接等於客訴結案。</p>${b('從客訴案件開始','go:complaint','primary mt16')}</div><div class="card"><h3>03｜數據 → 商家討論 → 素材 → 核准 → 渠道</h3><p class="small muted mt12">先確認素材用途，再核准版本。發布後處理部分失敗，直到讀回結果。</p>${b('從經營觀察開始','go:insights','primary mt16')}</div></div>`,'',true);break;case'search':modal('搜尋示範案件',`<p class="muted mb16">這個原型提供三筆可接續的案件。</p><div class="stack">${b('旅客 A · CASE-026 · 語音預約','go:inbox','full')}${b('旅客 B · C-017 · 語言承諾客訴','go:complaint','full')}${b('PR-008 · 六十分鐘品飲提案','go:proposal','full')}</div>`);break;case'notifications':modal('待辦提醒',`<div class="stack"><div class="callout amber">客訴退款需要正式結果核對。</div><div class="callout">服務提案缺素材用途核准。</div>${b('回到工作清單','go:work','primary')}</div>`);break;case'audit':modal('操作紀錄｜示範',`<div class="timeline"><div class="event good"><strong>案件建立</strong><p>案例與商家權限已固定。</p></div><div class="event"><strong>目前的本機狀態</strong><p>付款：${state.payment} ／ 預訂：${state.booking}<br>退款：${state.refund} ／ 渠道：${state.publication}</p></div><div class="event"><strong>無外部副作用</strong><p>本檔案不呼叫真實 API，不錄音或付款。</p></div></div>`);break;case'handoff':state.human=!state.human;render();toast(state.human?'原型：已切換為真人負責，AI 不再自動回覆。':'原型：已交回助理，案件進度保留。');break;case'send-case':state.sent=true;render();break;case'expire':state.quoteExpired=true;state.customerConsent=false;render();toast('報價失效：不能使用原確認執行付款。');break;case'voice-correct':state.voiceChanged=true;state.voiceChildren=1;state.children=1;state.demandRev++;state.customerConsent=false;state.voiceRequoted=false;state.quoteExpired=true;render();break;case'voice-quote':if(state.voiceChanged&&!state.voiceRequoted){state.voiceRequoted=true;state.quoteRev++;state.quoteExpired=false;render();toast('新版報價 NT$ 3,900。需重新取得客戶確認。')}else{state.children=state.voiceChildren;state.quoteRev++;state.quoteExpired=false;go('quote')}break;case'mute':state.muted=!state.muted;render();break;case'endcall':state.callClosed=true;render();break;case'transfer':modal('轉接真人｜示範',`<p>轉接到白名單值班窗口，交接需求、已執行動作與未完成項目。</p><div class="callout amber mt16">按下轉接，只代表送出要求；必須有實際接通結果。</div>`,b('取消','close')+b('模擬無人接聽','transfer-failed','primary'));break;case'transfer-failed':state.transfer='failed';closeModal();render();break;case'order-snapshot':modal('本筆訂單的成交快照',`${dl('訂單','ORD-1205-024')}${dl('服務版本','v5／Q-026 rev.'+state.quoteRev)}${dl('日期','2026/12/05 14:00 · Asia/Taipei')}${dl('人數',`2 成人、${state.children} 兒童`)}${dl('總價',money(3000+state.children*900))}${dl('現場接待','中文示範＋英文說明卡')}<div class="callout mt16">本訂單與客訴案件 C-017 是不同訂單，不混用快照。</div>`);break;case'snapshot':modal('成交快照｜不可用現在的商品覆蓋',`<div class="callout mb16">此為示範訂單的成交版本，不會隨新版商品修改。</div>${dl('客訴訂單','ORD-1108-017')}${dl('購買時間','2026/11/02')}${dl('成交版本','服務 v4／原渠道頁面快照')}${dl('原頁承諾','含英文講師')}${dl('原付款','NT$ 3,000 / TWD')}<p class="footnote mt16">客戶陳述、商家紀錄與已確認事實分別保存。資料只供本案處理。</p>`);break;case'verify-order':if(state.payment!=='paid'){toast('尚未付款，不能把訂單顯示成已確認。');break}state.booking='confirmed';render();toast('原型：查到同一筆供應預訂，付款、訂單與通知已核對。');break;case'refund-preview':if(!state.refundConsent||state.refund!=='none')break;modal('確認執行政策內退款',`${dl('訂單','ORD-1108-017')}${dl('退款金額','NT$ 600')}${dl('授權依據','DEMO-R02 v1／客戶接受紀錄')}${dl('執行方式','原渠道收款方／原付款路徑')}<div class="callout amber mt16">本機模擬，不退款給真實客戶。送出後保持處理中，直到正式結果核對。</div>`,b('返回檢查','close')+b('執行退款（模擬）','refund-execute','primary'));break;case'refund-execute':if(state.refund==='none'){state.refund='pending'}closeModal();render();break;case'verify-refund':state.refund='done';render();toast('退款已核對；案件仍待客戶回覆，不自動關案。');break;case'close-complaint':if(state.refund==='done'&&state.customerAccepted){state.complaintClosed=true;render()}break;case'escalate':modal('升級不是把案件丟出去',`<div class="field mb16"><label>負責窗口</label><select><option>示例經營者 · 商家負責人</option><option>示例旅行社 · 訂單服務</option></select></div><div class="field"><label>交接摘要</label><textarea>客戶已驗證；原頁承諾與現場語言有落差；待核對補救與後續回覆。</textarea></div><div class="callout mt16">已執行退款會保留；不因轉交再做第二次。</div>`,b('返回','close')+b('建立示範交接','escalate-confirm','primary'));break;case'escalate-confirm':closeModal();toast('示範交接已建立；原案件保留追蹤責任。');break;case'evidence':modal('觀察依據｜合成測試資料',`<p class="small muted mb16">18 件獨立詢問明確表達時間限制。以下為示例明細，不是實際商家數據。</p><div class="tablewrap"><table style="min-width:0"><thead><tr><th>案件</th><th>明確陳述</th><th>分類</th></tr></thead><tbody>${Array.from({length:18},(_,i)=>`<tr><td>DEMO-${String(i+1).padStart(3,'0')}</td><td>${['只能停留一小時','下一個行程前有六十分鐘','想找時間更短的品飲'][i%3]}</td><td>明確時間限制</td></tr>`).join('')}</tbody></table></div><p class="footnote mt16">本觀察只支持討論短版，不代表已驗證需求規模或價格接受度。</p>`,'',true);break;case'coverage':modal('資料覆蓋與查詢口徑',`${dl('期間','2026/10/13–11/11')}${dl('有效詢問／完成訂單','128／31')}${dl('未成交案件','97：已知39、未知58')}${dl('去重','以案件為單位，非訊息數')}${dl('渠道曝光','外部平台未取得')}<div class="callout mt16">數字為合成測試值；查詢版本 INSIGHT-DEMO-v1。未取得的資料維持未知。</div>`);break;case'send-owner':{let v=document.getElementById('ownerMessage')?.value.trim();if(!v){toast('請先輸入討論內容。');break}state.ownerReply=v;render();break}case'owner-voice':modal('經營者語音素材｜示範',`<p>原型不啟用麥克風。正式產品讓經營者用語音描述流程，助理整理為可審閱草案。</p><div class="bubble mt16">示例口述：「短版兩款茶，六十分鐘；不包含完整沖泡實作。」</div>`,b('返回','close')+b('加入示例口述','owner-voice-add','primary'));break;case'owner-voice-add':state.ownerReply='短版兩款茶，六十分鐘；不包含完整沖泡實作。';closeModal();render();break;case'sample-assets':state.assetReceived=true;render();toast('已載入示範素材，仍需用途核准才可發布。');break;case'pick-files':document.getElementById('fileInput')?.click();break;case'approve-assets':if(state.assetReceived&&state.assetRights){state.assetReady=true;render();toast('本提案素材用途已模擬核准。')}break;case'conflict':state.conflict=true;state.proposalApproved=false;state.approvalAck=false;render();break;case'reload-version':state.baseVersion=6;state.targetVersion=7;state.conflict=false;state.proposalApproved=false;state.approvalAck=false;render();toast('最新差異已載入。需要重新勾選並核准 v7。');break;case'approve-proposal':if(!state.assetReady||state.conflict)break;if(!document.getElementById('approvalAck')?.checked){toast('請先確認這個版本的內容、資源與渠道。');break}modal('核准並建立兩個發布工作',`${dl('服務版本','v'+state.targetVersion)}${dl('新選項','六十分鐘品飲／NT$ 980')}${dl('適用渠道','自有官網、合作旅宿頁')}${dl('不變項目','原服務及已成交訂單')}<div class="callout mt16">核准後由助理接續執行；此原型只模擬部分完成及驗證流程。</div>`,b('返回審閱','close')+b('確認核准（模擬）','approve-confirm','primary'));break;case'approve-confirm':approve();break;case'retry-publish':if(state.publication==='draft')break;state.publication='review';render();toast('已重新送出已確認失敗項目；仍待審核與讀回。');break;case'verify-publish':if(state.publication!=='review'){toast('請先重試已確認失敗的發布，再核對正式結果。');break}state.publication='done';render();toast('已模擬讀回兩個選定渠道的正確版本。');break;case'publication-evidence':modal('渠道結果證據｜示範',`${dl('工作','PUB-DEMO-008')}${dl('渠道','自有官網')}${dl('期望版本','v'+state.targetVersion)}${dl('實際觀測',state.publication==='draft'?'尚未執行':'v'+state.targetVersion)}${dl('檢查欄位','名稱／內容／價格／語言／可售規則')}<div class="callout mt16">外部接口的 200 或「已送出」不足以標示已上線；需要正式狀態或讀回證據。</div>`);break;case'finance-method':modal('計算口徑｜示例',`<p class="small">商家應收＝86,400 − 600 − 8,640 − 1,710＝75,450。</p><p class="small mt12">已知變動成本後貢獻＝75,450 − 26,400 − 18,000 − 3,600 − 2,400＝25,050。</p><div class="callout amber mt16">資料為 UI 演示，非實際費率、報價或營運成績。固定成本未取得，不顯示淨利。</div>`);break;case'export-finance':{const csv='\uFEFF來源,商品總額,退款,渠道費,金流費,商家應收\n商家原客,43200,0,0,864,42336\n合作渠道,28800,600,4320,576,23304\n外部平台,14400,0,4320,270,9810\n';let u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='示範對帳_非真實資料.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);break}case'connector-test':modal('能力測試｜模擬結果',`${dl('商品讀取','通過')}${dl('查詢可售','通過')}${dl('建立預訂／查單','通過')}${dl('商品修改','未提供；不可推定支援')}${dl('外部權限','尚未取得真實商家授權')}<div class="callout">此頁只示範驗證結果怎麼呈現，不是已完成真實串接。</div>`);break;case'connection-toggle':state.connectionDown=!state.connectionDown;render();break;case'language':state.lang=state.lang==='en'?'zh':'en';render();break;case'mobile-voice':state.mobileVoice=!state.mobileVoice;render();break;case'customer-quote':state.quoteExpired=false;state.quoteRev=state.demandRev;state.customerConsent=false;go('quote');break;case'refresh-quote':state.quoteExpired=false;state.quoteRev++;state.customerConsent=false;render();break;case'customer-pay':if(!state.customerConsent||state.quoteExpired)break;if(state.connectionDown){modal('預約來源暫時無法使用','<p>先保留這次條件，不繼續付款或重新下單。可以稍後查詢或由原服務窗口接續。</p>');break}modal('模擬安全付款接續',`<p>正式產品在原收款方的安全付款頁完成付款，並由後端查核結果。本原型不開啟任何金流、不收卡號。</p><div class="callout mt16">按下後只把本機狀態改為「付款已核對／供應確認中」，接著測試查單。</div>`,b('返回','close')+b('模擬付款回呼成功','payment-success','primary'));break;case'payment-success':state.payment='paid';state.booking='unknown';closeModal();go('receipt');break;case'customer-service':modal('提出訂後需求｜示範',`<div class="field mb16"><label>需要協助的事情</label><select><option>想改期</option><option>查詢訂單內容</option><option>報到方式</option><option>提出客訴</option></select></div><div class="field"><label>補充說明</label><textarea placeholder="請描述你的需求；勿填寫卡號或證件"></textarea></div><div class="callout mt16">提出申請不代表改期或退款已完成，仍需核對規則與正式結果。</div>`,b('返回','close')+b('建立示範申請','customer-service-create','primary'));break;case'customer-service-create':closeModal();toast('示範申請已建立；原訂單內容尚未改變。');break;case'mobile-material':modal('補交素材並確認用途',`<p class="small">本次需要品飲操作圖片與英文說明卡。這個按鈕只載入合成素材，不啟用手機相機或上傳。</p><div class="callout mt16">用途：本次六十分鐘方案；渠道：自有官網與合作旅宿頁。不得直接擴大到其他廣告或渠道。</div>`,b('返回','close')+b('載入並核准示範素材','mobile-material-approve','primary'));break;case'mobile-material-approve':state.assetReceived=true;state.assetRights=true;state.assetReady=true;closeModal();render();break;case'mobile-approve':if(!state.assetReady)break;modal('核准版本 v'+state.targetVersion,`${dl('售價','NT$ 980／人')}${dl('服務','60 分鐘品飲／12 歲以上')}${dl('包含／不包含','兩款茶／不含完整實作')}${dl('渠道','官網、合作旅宿頁')}${dl('共用資源','原講師與座位池')}<div class="callout mt16">原服務與舊訂單不改。本次操作只模擬核准與發布。</div>`,b('返回審閱','close')+b('確認核准（模擬）','mobile-approve-confirm','primary'));break;case'mobile-approve-confirm':state.proposalApproved=true;state.publication='partial';closeModal();render();break;case'mobile-publish':modal('發布進度｜示範',`<div class="minirow"><span>自有官網</span>${tag('已驗證生效','green')}</div><div class="minirow"><span>合作旅宿頁</span>${tag(state.publication==='done'?'已驗證':'待核對',state.publication==='done'?'green':'amber')}</div><div class="callout mt16">經營者已完成決策，助理保留後續工作，逐渠道確認結果。</div>`,b('關閉','close')+b('開啟完整渠道畫面','go:channels','primary'));break;default:toast('此操作未定義，請使用流程導覽。')}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act],[data-go]');if(!t)return;if(t.disabled)return;e.preventDefault();if(t.dataset.go)go(t.dataset.go);else act(t.dataset.act)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();const m=document.querySelector('.modal');if(e.key==='Tab'&&m){const fs=[...m.querySelectorAll('button:not(:disabled),input:not(:disabled),select,textarea,a[href]')];if(!fs.length)return;let first=fs[0],last=fs[fs.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(r!==route){route=r;render();window.scrollTo(0,0)}});
window.Prototype={go,reset:()=>{state=base();render()},setState:(x)=>{Object.assign(state,x);render()},getState:()=>JSON.parse(JSON.stringify(state)),setWire:(x)=>{wire=!!x;render()},setAnnotations:(x)=>{annotations=!!x;render()},pages:PAGES};
