<body>
<div class="demo-bar"><span><strong>UX 2.0 互動原型</strong><span class="long">　· 全部為合成示範資料；未連接電話、AI、金流或渠道</span></span><button data-act="scenarios">切換示範情境</button></div>
<div class="shell"><header class="top"><button class="brand" data-act="home" aria-label="回到助理首頁"><span class="mark" id="brandmark"></span>商家助理<span class="store">示範茶室</span></button><nav class="topnav" aria-label="次要功能"><button data-act="activity">工作回報</button><button data-act="policy">自主範圍</button><span class="avatar" aria-hidden="true">店</span></nav></header><main class="main" id="main" tabindex="-1"></main><div class="composer-wrap" id="globalcomposer"><form class="composer" id="quickform"><button type="button" data-act="attach-context" aria-label="提供照片、文件或語音檔" title="提供素材"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 12v5a4 4 0 008 0V7a3 3 0 00-6 0v10a1 1 0 002 0V8"/></svg></button><input id="quickinput" aria-label="交代助理一件事" placeholder="交代我一件事，或問問進度…" autocomplete="off"><button class="send" type="submit" aria-label="送出訊息"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></form><p class="composer-note">原型可試：今天怎麼樣、先暫停接單、繼續短版。其他文字只會存為本機草稿。</p></div><footer class="footer"><span>範例商家與數據皆為虛構 · 原型不會執行真實交易</span><button data-act="reset" style="font-size:10px;min-height:25px;padding:0">重設原型</button></footer></div>
<div id="modalroot"></div><div id="live" aria-live="polite" aria-atomic="true" class="hidden"></div><input type="file" id="assetInput" class="hidden" accept="image/*,audio/*,video/*,.pdf">
<script>
'use strict';
const $=id=>document.getElementById(id);
const icons={spark:'<path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2L12 3z"/>',check:'<path d="M5 12l4 4 10-10"/>',phone:'<path d="M7 3H4a1 1 0 00-1 1c0 9.4 7.6 17 17 17a1 1 0 001-1v-3l-5-2-2 2c-3-1-6-4-7-7l2-2-2-5z"/>',refund:'<path d="M4 10a8 8 0 111 7M4 10V4m0 6h6M12 8v8m3-6c-4-3-7 2-3 2s1 5-3 2"/>',arrow:'<path d="M5 12h14m-5-5l5 5-5 5"/>',back:'<path d="M19 12H5m5-5l-5 5 5 5"/>',file:'<path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6m-6 4h6"/>',shield:'<path d="M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6zM8 12l3 3 5-6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',link:'<path d="M10 14l4-4m-6 5l-1 1a4 4 0 01-6-6l4-4a4 4 0 016 0m2 3l1-1a4 4 0 016 6l-4 4a4 4 0 01-6 0"/>'};
function icon(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="icon" aria-hidden="true">'+(icons[n]||icons.spark)+'</svg>'}
$('brandmark').innerHTML=icon('spark');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const initial=()=>({view:'home',phase:'idea',draft:'',merchantText:'',facts:{name:'60 分鐘品飲版',duration:60,price:null,capacity:6,time:'平日 14:00',content:'兩款茶品飲＋一份茶點；不含沖泡實作',onsite:'中文示範＋英文說明卡'},asset:null,rights:false,noEnglish:false,revision:1,approvedRevision:null,approvedAt:null,web:'not_started',partner:'not_started',paused:false,deferred:false,channelProblem:false,exception:false,exceptionResolved:false,standardRefund:'pending',bookingVerified:true,emptyReason:null,worklog:[],localNotes:[]});
let s=initial(), modal=null, toastTimer=null, generation=0, lastFocus=null;const storageKey='merchant-ux2-v1';
try{let saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved){s={...initial(),...saved};if(s.asset?.previewLost&&!s.asset.sample){s.asset=null;s.rights=false;if(!s.approvedRevision&&['material','review','edit'].includes(s.phase)){s.phase='material';s.view='material';}}}}catch(e){}
function save(){try{let copy=JSON.parse(JSON.stringify(s));if(copy.asset?.objectURL)copy.asset={...copy.asset,objectURL:null,previewLost:true};localStorage.setItem(storageKey,JSON.stringify(copy));}catch(e){}}
function log(type,detail){s.worklog.push({type,detail,revision:s.revision,at:new Date().toISOString()});save()}
function toast(msg){let prev=document.querySelector('.toast');if(prev)prev.remove();let t=document.createElement('div');t.className='toast';t.textContent=msg;t.setAttribute('role','status');document.body.append(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),4200)}
function route(view){s.view=view;save();render();window.scrollTo({top:0,behavior:'instant'});$('main').focus({preventScroll:true});}
function btn(label,act,cls='primary',extra=''){return `<button class="${cls}" data-act="${act}" ${extra}>${label}</button>`}
function back(){return `<button class="back" data-act="home">${icon('back')}回到助理</button>`}
function ai(text){return `<div class="assistant-msg"><span class="ai-dot">${icon('spark')}</span><div class="bubble">${text}</div></div>`}
function owner(text){return `<div class="owner-msg"><div class="name">你的說明</div>${esc(text).replace(/\n/g,'<br>')}</div>`}
function status(){return `<div class="eyebrow"><span class="dot ${s.paused?'amber':''}"></span>${s.paused?'新的自動接單已暫停；既有訂單仍持續處理':'助理已依授權接單 · 需要你時才通知'}</div>`}
function worklines(){return `<section class="autowork" aria-label="自動處理摘要"><h3>這些我在處理，不需要你操作</h3><div class="workline"><span class="circle-icon">${icon('phone')}</span><div class="workbody"><strong>語音預訂已成立</strong><p>2 位旅客 · 原預約系統與收款皆已確認。</p></div><button class="linkbtn" data-act="booking">查看結果</button></div><div class="workline"><span class="circle-icon">${icon('refund')}</span><div class="workbody"><strong>${s.standardRefund==='done'?'規則內退款已完成':'規則內退款正在追蹤'}</strong><p>${s.standardRefund==='done'?'原付款路徑已確認退回；已通知客戶。':'金流已受理，尚未確認退款完成；我會繼續核對。'}</p></div><button class="linkbtn" data-act="refund">查看進度</button></div></section>`}
function home(){let focus='';let title='日常接單，我在處理。';let subtitle='目前有 1 件事需要你的判斷。其他工作我會接著完成。';
if(s.exception&&!s.exceptionResolved){title='有一筆例外，需要你決定。';subtitle='標準售後已處理。這次額外補救超出原先授權。';focus=`<section class="card decision"><div class="label"><span class="badge wait">需要你的判斷</span><span>例外補救</span></div><h2>要不要支付這筆額外交通費？</h2><p class="body">原服務費已依政策退還。客人另要求交通費 NT$600，目前尚未承諾或付款。</p><div class="actions">${btn('查看事實與選項','complaint')}${btn('先請店長確認','escalate','quiet')}</div></section>`}
else if(s.channelProblem){title='有一個授權，需要你接一下。';subtitle='商品內容不用重做；我已保留已完成的進度。';focus=`<section class="card decision"><div class="label"><span class="badge wait">需要你連結帳號</span></div><h2>合作旅宿的登入已失效</h2><p class="body">官網已更新，旅宿端的新商品尚未上線。只需重新授權，我會接續尚未完成的發布，不重發官網商品。</p><div class="actions">${btn('重新連結帳號','reconnect')}${btn('查看已完成內容','result','quiet')}</div></section>`}
else if(s.phase==='idea'&&!s.deferred){focus=`<section class="card decision"><div class="label"><span class="badge">需要你的判斷</span><span>一項服務建議</span></div><h2>要不要增加一個<br class="mobilebreak">60 分鐘品飲版？</h2><p class="body">最近有客人明確表示只能停留一小時。我建議另做短版，保留原本的完整體驗；內容與價格需要你決定。</p><div class="actions">${btn('一起確認內容 '+icon('arrow'),'discuss')}${btn('先維持原服務','defer','quiet')}</div><button class="linkbtn" data-act="evidence" style="margin-top:14px">看看這項建議的依據</button></section>`}
else if(['material','review','edit','discuss'].includes(s.phase)){let ismat=s.phase==='material',istalk=s.phase==='discuss';title=ismat?'只差一份素材，我就能整理好。':istalk?'這項服務，還在等你的想法。':'內容已整理，等你做最後確認。';subtitle='不用重新開案，我記得你前面交代的內容。';focus=`<section class="card decision"><div class="label"><span class="badge">${ismat?'需要你提供素材':istalk?'需要你說明服務':'等待你的核准'}</span></div><h2>${ismat?'提供現有英文說明卡即可':istalk?'新服務可以怎麼做？':'確認短版內容與試行範圍'}</h2><p class="body">${ismat?'工作區與茶具照片會沿用已授權版本，不需要重拍。你也可以先只提供中文接待版。':istalk?'用你方便的方式說明內容、時段與價格；我會整理成草案，不直接發布。':'核准後，我會更新官網與合作旅宿；其他渠道與既有訂單都不變。'}</p><div class="actions">${btn(ismat?'接著提供素材':istalk?'繼續討論':'查看確認卡','resume')}</div></section>`}
else if(['executing','result'].includes(s.phase)){title='你的決定，我正在落實。';subtitle='目前沒有需要你操作的步驟。';focus=`<section class="card"><div class="label"><span class="badge">${s.partner==='live'?'已核對完成':'我會繼續追蹤'}</span></div><h2 style="margin-top:13px">${s.partner==='live'?'短版已在兩個入口上線':'官網已更新，旅宿端等待審核'}</h2><p class="body muted" style="font-size:13px;margin-top:10px">${s.partner==='live'?'兩個入口已讀回確認；新舊商品共用原預約資源，舊訂單內容不變。':'不是全部完成。待對方審核通過後，我會核對內容並回報。'}</p><div class="actions">${btn('查看工作回報','result','secondary')}</div></section>`}
else{title='現在沒有需要你處理的事。';subtitle='我會繼續接單、處理規則內售後。有新決策時再找你。';focus=`<section class="empty"><div class="successmark">${icon('check')}</div><h2>不用守著這個畫面</h2><p>${s.exceptionResolved?'例外補救已送出，尚待正式結果。我會繼續核對，不會先把客訴關掉。':s.emptyReason==='investigating'?'客訴已交給指定店長補查；助理會保留證據與期限，案件尚未結束。':s.emptyReason==='deferred'?'你已選擇維持原服務。這項建議先收起來，有新的證據再討論。':'標準訂單與售後依授權繼續處理。你可以直接交代新工作，不需要巡查各個功能頁。'}</p></section>`}
return `<section class="intro homeintro">${status()}<h1 class="homehero">${title}</h1><p>${subtitle}</p></section>${focus}${worklines()}`}
function discuss(){return `${back()}<p class="stepmini"><span>一起把服務說清楚</span>　／　還不會公開</p><h1 class="threadtitle">短版可以怎麼做？</h1><p class="thread-sub">你只要說明服務，我來整理商品與渠道內容。</p>${ai(`<p>原本 90 分鐘完整體驗不變。我想和你確認另一個 60 分鐘版本，先放官網與合作旅宿試行。</p><p style="margin-top:8px">不用填一整張商品表。告訴我包含什麼、什麼時段可以做，以及價格；已有的素材我會先沿用。</p><div class="insight"><p><strong>先確認是否值得做</strong>，不是只把原活動縮短。老師、座位仍共用原預約系統，不會多賣一份不存在的名額。</p><button class="linkbtn" data-act="evidence">查看詢問依據</button></div>`)}<form id="merchantform" class="input-card"><label for="merchantText">直接用你的話說</label><textarea id="merchantText" placeholder="例如：可以另外做兩款茶品飲，不含實作。可開時段和定價是…">${esc(s.draft)}</textarea><div class="row wrap" style="margin-top:12px"><button type="button" class="pill" data-act="sample-reply">帶入示範說明</button><span class="small muted">原型只辨認示範欄位，不會呼叫 AI</span></div><div id="merchantError" class="input-error"></div><div class="actions"><button class="primary" type="submit">交給助理整理 ${icon('arrow')}</button>${btn('先不新增','defer','quiet')}</div></form>`}
function material(){let a=s.asset;return `${back()}<p class="stepmini">內容已整理　／　<span>只補這次缺的素材</span></p><h1 class="threadtitle">只需要你補一份說明卡。</h1>${owner(s.merchantText)}${ai(`<p>我會沿用已授權的工作區與茶具照片。你提到「英文說明卡」，目前還沒有檔案；請直接上傳現有版本即可。</p><p class="small muted" style="margin-top:8px">素材僅放在本機原型；不會傳送。實際服務仍須內容檢核與商家核准。</p>`)}<section class="card"><div class="row"><h3>英文說明卡</h3><span class="badge ${a?'gray':'wait'}">${a?'已收到，尚未核准':'待補充'}</span></div>${a?`<div class="asset">${a.objectURL&&a.mime?.startsWith('image/')?`<img src="${a.objectURL}" alt="你提供的本機素材預覽">`:`<span class="asset-icon">${a.sample?'DEMO':'FILE'}</span>`}<div><h3>${esc(a.name)}</h3><p>${a.sample?'示範素材，不是實際服務證據':'僅保存在目前瀏覽器；重新整理可能須重選'}</p></div></div>`:`<div class="asset"><span class="asset-icon">＋</span><div><h3>照片、PDF、短片或語音說明都可以</h3><p>不用重新填資料庫；我會對應到這項服務。</p></div></div>`}<div class="pills">${btn(a?'更換檔案':'選擇本機檔案','upload','secondary')}${btn('使用示範素材','sample-asset','quiet')}</div><label class="checkrow"><input id="rights" type="checkbox" ${s.rights?'checked':''}><span>確認我有權提供此素材，並允許用在本次官網及合作旅宿的服務說明。</span></label><div class="actions">${btn('確認用途，查看服務草案','review','primary',a&&s.rights?'':'disabled')}${btn('先只做中文接待版','skip-english','quiet')}</div></section>`}
function review(){let f=s.facts;return `${back()}<p class="stepmini">內容與素材已整理　／　<span>一次確認，助理接著執行</span></p><h1 class="threadtitle">按這個範圍試行，好嗎？</h1><p class="thread-sub">這是新服務與價格的核准，不是請你逐步操作上架。</p><section class="card"><div class="row"><span class="tinycap">服務變更 · 第 ${s.revision} 版</span><button class="linkbtn" data-act="edit">調整內容</button></div><h2 class="summary-title" style="margin-top:13px">${esc(f.name)}</h2><div class="specgrid"><div><label>包含內容</label><strong>${esc(f.content)}</strong></div><div><label>價格</label><strong>每人 NT$${Number(f.price||0).toLocaleString()}</strong></div><div><label>可開時段</label><strong>${esc(f.time)} · ${f.duration} 分鐘</strong></div><div><label>容量與資源</label><strong>最多 ${f.capacity} 人 · 與原活動共用老師</strong></div><div><label>現場接待</label><strong>${esc(f.onsite)}</strong></div><div><label>試行入口</label><strong>官網、合作旅宿</strong></div></div><div class="scopebox"><p><strong>保持不變</strong>　90 分鐘原方案、已成立訂單、其他渠道。</p><p><strong>我會接著做</strong>　整理兩個入口的內容、建立商品、送出發布、核對結果。</p><p><strong>執行前確認</strong>　沿用原資源規則；正式系統會再驗證可售與版本。本原型使用合成結果。</p></div><div class="notice">不預估成交成長。上線後分開追蹤完成訂單、資源占用及服務成本，再決定是否擴大。</div><div class="summary-actions">${btn('確認並交給助理 '+icon('arrow'),'approve')}${btn('先存草稿','save-draft','secondary')}</div><p class="micro">本次核准僅適用第 ${s.revision} 版、上述兩個入口及已確認用途的素材。內容再改就重新核准；原型不會真正上架。</p></section>`}
function edit(){let f=s.facts;return `${back()}<h1 class="threadtitle">改你的決定，不重做整份工作。</h1><p class="thread-sub">修改後會形成新版確認卡；上一版核准不會沿用。</p><form class="card" id="editform"><div class="editgrid"><div class="field full"><label for="editName">服務名稱</label><input id="editName" value="${esc(f.name)}" required></div><div class="field full"><label for="editContent">這個版本包含什麼</label><input id="editContent" value="${esc(f.content)}" required></div><div class="field"><label for="editPrice">每人價格（新台幣）</label><input type="number" id="editPrice" min="1" max="100000" step="1" value="${f.price||680}" required></div><div class="field"><label for="editDuration">服務時間（分鐘）</label><input type="number" id="editDuration" min="15" max="300" step="5" value="${f.duration}" required></div><div class="field"><label for="editCapacity">最多幾人</label><input type="number" id="editCapacity" min="1" max="8" value="${f.capacity}" required></div><div class="field"><label for="editTime">可開時段</label><input id="editTime" value="${esc(f.time)}" required></div></div><div class="notice">既有示範資源最多 8 席。正式服務須重查老師與場地，不會因修改人數而新增庫存。</div><div class="actions"><button type="submit" class="primary">更新確認卡</button>${btn('放棄這次修改','review','quiet')}</div></form>`}
function result(){let all=s.partner==='live';return `${back()}<div class="successmark">${icon(all?'check':'clock')}</div><h1 class="threadtitle">${all?'兩個入口都已核對完成。':s.channelProblem?'已完成的保留，只差一次授權。':'已經接手，不用你盯著上架。'}</h1><p class="thread-sub">${all?'這次變更已完成；不是只收到平台回覆。':s.channelProblem?'官網不用重做；重新連結後只接續合作旅宿。':'我會區分「已生效」與「等待對方」，不把送出當成完成。'}</p><section class="card"><div class="row"><h3>${esc(s.facts.name)}</h3><span class="badge gray">已核准第 ${s.approvedRevision||s.revision} 版</span></div><div class="statusrows"><div class="statusrow"><div><strong>官網</strong><p>${s.web==='live'?'已讀回商品內容、價格與預約對應。':'已建立發布工作，尚未確認生效。'}</p></div><span class="badge ${s.web==='live'?'':'wait'}">${s.web==='live'?'已生效':'核對中'}</span></div><div class="statusrow"><div><strong>合作旅宿</strong><p>${s.channelProblem?'登入已失效；商品尚未上線。':all?'已讀回核准版本，訂單仍進原預約流程。':'對方審核中；我會接著追蹤，不需要你催。'}</p></div><span class="badge ${all?'':'wait'}">${s.channelProblem?'需要授權':all?'已生效':'待外部審核'}</span></div></div><p class="micro">原方案與舊訂單保持不變。正式上線後才有真實成效；這裡不生成假訂單或成長數字。</p><div class="actions">${s.channelProblem?btn('重新連結帳號','reconnect'):btn('回到助理','home','secondary')}${btn('查看執行憑據','publication-proof','quiet')}</div></section><p class="offline-note">原型只有本機模擬狀態。可從上方「切換示範情境」模擬外部審核完成或登入失效；關閉頁面不會進行任何外部工作。</p>`}
function complaint(){return `${back()}<p class="stepmini"><span>只把超出政策的決定交給你</span></p><h1 class="threadtitle">這筆交通費，需要你的判斷。</h1>${ai('<p>客人反映現場語言與成交頁承諾不一致。原服務費 NT$2,400 已依既定政策退回；客人另要求 NT$600 交通費，尚未核准。</p>')}<section class="card"><div class="specgrid" style="margin-top:0"><div><label>已確認</label><strong>歷史商品頁與現場紀錄有落差</strong></div><div><label>客戶另外提出</label><strong>交通費 NT$600</strong></div><div><label>已處理</label><strong>原服務費已退</strong></div><div><label>本次需決定</label><strong>是否另行補救</strong></div></div><div class="notice">同意後，助理會透過核准的補救流程申請與核對。送出不是完成，也不自動代表客戶同意結案。</div><div class="actions">${btn('同意本次補貼 NT$600','approve-remedy')}${btn('先補查證據','investigate','secondary')}</div><button class="linkbtn" data-act="complaint-proof" style="margin-top:14px">查看事實與原始承諾</button></section>`}
function render(){let map={home,discuss,material,review,edit,result,complaint};$('main').innerHTML=(map[s.view]||home)();$('globalcomposer').classList.toggle('hidden',['discuss','edit'].includes(s.view));document.title='商家助理 · '+({home:'只看需要你的事',discuss:'討論服務',material:'提供素材',review:'一次確認',edit:'調整內容',result:'工作回報',complaint:'例外決策'}[s.view]||'工作')+'｜互動原型';}
function openModal(title,body){lastFocus=document.activeElement;modal={title,body};$('modalroot').innerHTML=`<div class="dialog-shade"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialoghead"><h2 id="dialogTitle">${title}</h2><button class="close" data-act="close" aria-label="關閉">×</button></div>${body}</section></div>`;setTimeout(()=>document.querySelector('.dialog button')?.focus(),10)}
function closeModal(){modal=null;$('modalroot').innerHTML='';lastFocus?.focus?.()}
function evidence(){openModal('這項建議從哪裡來？',`<span class="badge gray">合成測試資料 · 非真實營運結果</span><div class="evidence"><p><strong>觀察：</strong>近 14 天共 36 個獨立詢問案件，8 個明確表示只可停留約一小時。</p><p><strong>不知道：</strong>這些人是否接受新品內容與價格，尚未驗證；不能換算成保證訂單。</p><p><strong>建議：</strong>保留原服務，新增有限時段的品飲版試行。</p></div><details><summary>看示範詢問與統計口徑</summary><p>示範案件 Q-008：「離開前只有一小時，還有適合的體驗嗎？」<br>示範案件 Q-019：「我下午兩點後可以，三點得離開。」<br>同一案件重複訊息只計一次；其他 28 案不能都當成未成交。語音／文字跨入口合併需身分驗證。</p></details><p class="small muted">正式產品需從可追溯事件產生數字，這裡只是測試資料。</p>`)}
function booking(){openModal('語音預訂已完成',`<span class="badge">不用你操作</span><dl class="receipt"><dt>客戶需求</dt><dd>兩位旅客 · 90 分鐘完整體驗</dd><dt>客戶確認</dt><dd>已確認日期、人數、現場語言及正式報價</dd><dt>付款結果</dt><dd>正式查詢已確認收款（示範結果）</dd><dt>供應預訂</dt><dd>B-DEMO-102 · 原預約系統已確認</dd><dt>交付</dt><dd>訂單與報到資訊已送出</dd></dl><div class="notice">不需要老闆再按「確認收款」或「完成預訂」。要介入時，才切換工作責任。</div><details><summary>查詢過程與語音摘要</summary><p>來電 → 明確日期與人數 → 查價查位 → 客戶同意 → 安全付款 → 核對付款及訂位 → 發送確認。此原型沒有實際通話或錄音。</p></details>${btn('我需要人工接續此案','takeover','secondary')}`)}
function refund(){openModal('規則內售後：助理持續處理',`<span class="badge ${s.standardRefund==='done'?'':'wait'}">${s.standardRefund==='done'?'退款已確認':'退款待正式結果'}</span><dl class="receipt"><dt>原因</dt><dd>在核准的可取消期間內提出申請</dd><dt>已完成</dt><dd>客戶驗證、政策檢查、原渠道取消與退款申請</dd><dt>下一步</dt><dd>${s.standardRefund==='done'?'已通知客戶；保留重新詢問入口':'等待金流結果，逾時轉指定支援，不要求老闆查帳'}</dd><dt>目前負責</dt><dd>助理／原收款方</dd></dl><details><summary>處理依據與狀態</summary><p>原取消規則版本 C-DEMO-2；付款持有人已驗證。此示範為單筆部分退款 NT$1,200，不會重複發起。取消完成、退款完成、客訴結案各自記錄。</p></details><p class="small muted">狀態是原型合成資料；沒有實際送出退款。</p>`)}
function policy(){openModal('你授權的範圍',`<p class="muted" style="font-size:13px">這裡只在設定或改變授權時使用，不是每天的工作頁。</p><div class="evidence"><h3>依既定規則直接處理</h3><p>語音與文字接單、報價、客戶同意後預訂、符合政策的取消退款、補寄確認、已核准內容的發布與追蹤。</p></div><div class="evidence"><h3>需要你作新決策</h3><p>新增服務與價格、變更正式承諾、例外補救、擴大素材用途、新渠道授權。</p></div><div class="switchrow"><div><strong>新的自動接單</strong><p class="small muted">暫停不取消已成立訂單；付款核對、退款與必要通知仍會繼續。</p></div><button class="switch ${s.paused?'off':''}" data-act="toggle-pause">${s.paused?'恢復接單':'暫停新接單'}</button></div><p class="small muted">本原型只變更本機狀態，沒有實際停用任何商家服務。</p>`)}
function activity(){openModal('工作回報，不是待辦清單',`<p class="muted" style="font-size:13px">標準工作由助理處理。需要你介入時，首頁才會提出一個明確請求。</p>${worklines()}${s.approvedRevision?`<div class="evidence"><p><strong>服務改版：</strong>第 ${s.approvedRevision} 版已核准。官網 ${s.web==='live'?'已生效':'尚待核對'}；合作旅宿 ${s.channelProblem?'等待重新授權':s.partner==='live'?'已生效':'審核中'}。</p>${btn('查看這次改版','open-result','linkbtn')}</div>`:''}<details><summary>展開執行紀錄（本機）</summary>${s.worklog.length?s.worklog.slice(-12).map(x=>`<p><strong>${esc(x.type)}</strong> · ${esc(x.detail)}<br><span class="mono">${esc(x.at)}</span></p>`).join(''):'<p>尚未進行原型操作。首頁兩筆為初始合成案例。</p>'}</details>`)}
function scenarios(){openModal('原型導覽',`<p class="small muted" style="margin-bottom:15px">這是展示控制，不是商家產品選單。可直接測試正常、等待與例外狀態；不操作任何真實帳戶。</p><div class="modalsteps"><button class="scenario" data-act="scenario-normal"><strong>01　日常不打擾＋一項經營建議</strong><span>由首頁走完討論 → 素材 → 核准 → 發布。</span></button><button class="scenario" data-act="scenario-quiet"><strong>02　今天不需要老闆</strong><span>正常接單、退款仍有負責人，但沒有人工待辦。</span></button><button class="scenario" data-act="scenario-complaint"><strong>03　超出原政策的補救決策</strong><span>只問額外的決定，不把整個售後交回老闆。</span></button><button class="scenario" data-act="scenario-auth"><strong>04　渠道授權失效</strong><span>只請老闆恢復授權；其他已完成工作不重做。</span></button><button class="scenario" data-act="demo-complete"><strong>05　模擬外部審核與退款回報完成</strong><span>已有核准發布才可生效；已送出不等於已完成。</span></button><button class="scenario" data-act="scenario-revision"><strong>06　核准後修改內容</strong><span>新增版本；舊核准失效，已公開版本保留到重新核准。</span></button></div>`)}
function reconnect(){openModal('只重新連結，不重做商品',`<p>正式產品會帶你到合作系統的授權頁。本原型不索取帳號、密碼或驗證碼。</p><div class="evidence"><p><strong>授權完成後：</strong>接續第 ${s.approvedRevision||s.revision} 版的旅宿發布工作。官網不重建，已完成訂單不更動。</p></div><div class="actions">${btn('模擬授權完成','reconnected')}${btn('稍後再處理','close','quiet')}</div>`)}
const sampleReply='原本的完整體驗保留。另做60分鐘品飲，兩款茶和一份茶點，不含沖泡實作。平日14:00，每人680元，最多6人，和原活動共用老師。現場中文示範，搭配英文說明卡。';
function fixtureApproved(){s=initial();s.facts.price=680;s.merchantText=sampleReply;s.rights=true;s.asset={name:'英文說明卡－原型示範.pdf',sample:true};s.phase='result';s.approvedRevision=1;s.approvedAt=new Date().toISOString();s.web='live';s.partner='review';}
function approve(){if(s.phase!=='review'||!s.facts.price||(!s.noEnglish&&(!s.asset||!s.rights))){toast('內容、素材用途與價格尚未確認，不能執行。');return}if(s.approvedRevision===s.revision){route('result');return}s.approvedRevision=s.revision;s.approvedAt=new Date().toISOString();s.phase='executing';s.web='pending';s.partner='pending';s.channelProblem=false;const g=++generation;log('核准','核准服務第 '+s.revision+' 版；僅官網與合作旅宿');route('result');setTimeout(()=>{if(g!==generation||s.approvedRevision!==s.revision)return;s.web='live';s.partner='review';s.phase='result';log('官網已驗證','合作旅宿仍待外部審核，不要求商家操作');render();toast('官網已核對；合作旅宿待審核。這些都是原型模擬結果。')},900)}
function handle(act){if(act==='reset'||act.startsWith('scenario-')){clearTimeout(toastTimer);document.querySelector('.toast')?.remove();}switch(act){case'home':closeModal();route('home');break;case'close':closeModal();break;case'evidence':evidence();break;case'booking':booking();break;case'refund':refund();break;case'activity':activity();break;case'policy':policy();break;case'scenarios':scenarios();break;case'discuss':s.phase='discuss';route('discuss');break;case'defer':s.emptyReason='deferred';s.deferred=true;s.phase='deferred';log('維持原服務','收起同一建議；沒有新資料不重複追問');route('home');break;case'sample-reply':$('merchantText').value=sampleReply;s.draft=sampleReply;save();break;case'upload':$('assetInput').click();break;case'sample-asset':s.asset={name:'英文說明卡－原型示範.pdf',sample:true};s.rights=false;log('收到示範素材','僅收到，不代表用途已核准');render();break;case'review':if(s.noEnglish||s.asset&&s.rights){s.phase='review';route('review')}else{toast('請先提供素材並確認本次用途。')}break;case'skip-english':s.noEnglish=true;s.facts.onsite='僅中文示範；不對外語接待作額外承諾';s.phase='review';s.revision++;s.approvedRevision=null;log('調整接待範圍','暫不提供英文說明卡，前端需明確告知');route('review');break;case'edit':s.phase='edit';route('edit');break;case'save-draft':s.phase='review';save();route('home');toast('草案已保留；沒有發布。');break;case'resume':route(s.phase==='material'?'material':s.phase==='discuss'?'discuss':'review');break;case'approve':approve();break;case'result':route('result');break;case'open-result':closeModal();route('result');break;case'publication-proof':openModal('執行憑據',`<span class="badge gray">以下均為合成測試紀錄</span><dl class="receipt"><dt>本次核准</dt><dd>APPROVAL-DEMO-${s.approvedRevision||'-'} · 第 ${s.approvedRevision||'-'} 版</dd><dt>官網</dt><dd>${s.web==='live'?'已讀回核准版本 WEB-DEMO-060':'尚未驗證'}</dd><dt>合作旅宿</dt><dd>${s.channelProblem?'需要重新連結帳號':s.partner==='live'?'已讀回核准版本 PARTNER-DEMO-060':'審核中，尚無生效證據'}</dd><dt>舊訂單</dt><dd>未修改成交內容或價格</dd><dt>人工步驟</dt><dd>商品決策、必要素材及用途核准</dd></dl><p class="small muted">正式版本需呈現真實來源、時間、狀態與外部參考號。原型不含正式 API 結果。</p>`);break;case'reconnect':reconnect();break;case'reconnected':closeModal();s.channelProblem=false;s.partner='review';s.phase='result';log('重新授權','只恢復未完成的旅宿工作；官網不重做');route('result');toast('已模擬重新授權，等待旅宿審核。');break;case'toggle-pause':s.paused=!s.paused;log(s.paused?'暫停新接單':'恢復新接單','既有付款、退款及必要通知仍處理');render();policy();break;case'takeover':openModal('接續這個案件',`<p>你接手後，AI 不會再對這位客戶自動回覆。已完成訂位及付款不重做；尚未完成的對帳仍保留。</p><div class="actions">${btn('確認由我接續','confirm-takeover')}${btn('仍由助理處理','close','quiet')}</div>`);break;case'confirm-takeover':log('真人接手','僅接手 B-DEMO-102 的對話，原訂單未改動');closeModal();toast('原型已記錄你接手此案；未取消任何訂單。');break;case'complaint':route('complaint');break;case'approve-remedy':if(s.exceptionResolved)return;s.exceptionResolved=true;s.phase='deferred';s.deferred=true;log('例外補救核准','本次 NT$600 已核准；補救送出，尚未確認完成');route('home');toast('已模擬送出補救；正式完成前不會結案。');break;case'investigate':case'escalate':s.emptyReason='investigating';s.exception=false;s.deferred=true;s.phase='deferred';log('客訴補查','指定店長查核證據；案例持續開啟，等待責任人');route('home');toast('已建立補查工作；客訴未結案。');break;case'complaint-proof':openModal('原承諾與客戶主張',`<div class="evidence"><p><strong>合成事實：</strong>成交版本 S-DEMO-1 寫有英文講解；示範現場紀錄為中文示範。原服務費已退款。</p><p><strong>客戶另行主張：</strong>交通費 NT$600。未核准，不代表自動應付；不要求以刪除評價交換補救。</p></div><p class="small muted">正式產品需區分客戶陳述、商家紀錄與已查證事實；本原型不處理真實爭議。</p>`);break;case'scenario-normal':case'reset':generation++;s=initial();save();closeModal();route('home');break;case'scenario-quiet':generation++;s=initial();s.deferred=true;s.phase='deferred';s.standardRefund='done';save();closeModal();route('home');break;case'scenario-complaint':generation++;s=initial();s.exception=true;save();closeModal();route('home');break;case'scenario-auth':generation++;fixtureApproved();s.channelProblem=true;save();closeModal();route('home');break;case'demo-complete':if(!s.approvedRevision||s.approvedRevision!==s.revision){toast('目前沒有有效核准，不能模擬發布完成。');return}if(s.channelProblem){toast('仍需重新授權，不能直接跳成發布成功。');return}s.web='live';s.partner='live';s.standardRefund='done';s.phase='result';log('收到外部結果','兩個渠道讀回確認，退款收到完成結果');closeModal();route('result');break;case'scenario-revision':if(!s.approvedRevision){fixtureApproved()}generation++;s.approvedRevision=null;s.phase='edit';log('再次修改','既有公開版本保留；新內容需重新核准');closeModal();route('edit');break;case'attach-context':if(s.phase==='material'){route('material');$('assetInput').click()}else{openModal('把素材放到正在做的事裡',`<p>資料會跟著工作保存，不需要到「素材管理」重新建檔。</p><div class="notice">這個原型有一個可試的素材請求：60 分鐘品飲版的英文說明卡。請先完成服務討論，再把素材交給助理。</div><div class="actions">${btn('接著討論短版','open-discuss')}${btn('稍後再說','close','quiet')}</div>`)}break;case'open-discuss':closeModal();s.phase='discuss';route('discuss');break;default:toast('此操作未實作，不會顯示成已完成。')}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-act]');if(el&&!el.disabled){e.preventDefault();handle(el.dataset.act)}});
document.addEventListener('change',e=>{if(e.target.id==='rights'){s.rights=e.target.checked;save();render();$('rights')?.focus()}});
document.addEventListener('input',e=>{if(e.target.id==='merchantText'){s.draft=e.target.value;save()}});
document.addEventListener('submit',e=>{if(e.target.id==='merchantform'){e.preventDefault();const text=$('merchantText').value.trim();if(text.length<10){$('merchantError').textContent='請補充新服務內容，或使用示範說明體驗流程。';return}const price=text.match(/(?:每人|售價|價格|定價)\s*(?:NT\$|新台幣|台幣)?\s*(\d+)/i);const duration=text.match(/(\d+)\s*分鐘/);const capacity=text.match(/最多\s*(\d+)\s*人/);if(!price||!duration){$('merchantError').textContent='此原型未接 AI；請使用「每人680元、60分鐘」格式或帶入示範說明，避免假裝理解未知內容。';return}if(Number(price[1])<=0||Number(duration[1])<15||Number(capacity?.[1]||6)>8){$('merchantError').textContent='請確認價格、時長與示範資源上限 8 席。';return}s.merchantText=text;s.draft=text;s.facts.price=Number(price[1]);s.facts.duration=Number(duration[1]);s.facts.capacity=Number(capacity?.[1]||6);s.facts.name=s.facts.duration+' 分鐘品飲版';let t=text.match(/(平日|週末|週六|週日)?\s*(\d{1,2}:\d{2})/);if(t)s.facts.time=(t[1]||'指定日期')+' '+t[2];s.phase='material';log('收到經營者說明','已記錄原話；下一步只索取缺少素材');route('material')}
if(e.target.id==='editform'){e.preventDefault();generation++;s.facts={...s.facts,name:$('editName').value.trim(),content:$('editContent').value.trim(),price:Number($('editPrice').value),duration:Number($('editDuration').value),capacity:Number($('editCapacity').value),time:$('editTime').value.trim()};s.revision++;s.approvedRevision=null;s.phase='review';log('服務草案修改','生成第 '+s.revision+' 版，舊核准失效');route('review')}
if(e.target.id==='quickform'){e.preventDefault();let val=$('quickinput').value.trim();if(!val)return;$('quickinput').value='';if(/暫停.*接單/.test(val)){policy()}else if(/今天|進度|回報/.test(val)){activity()}else if(/短版|繼續/.test(val)){handle(s.phase==='material'||s.phase==='review'?'resume':'discuss')}else{s.localNotes.push(val);save();openModal('已保留這段交代，尚未執行',`<div class="owner-msg" style="margin-left:0">${esc(val)}</div><p class="small muted">原型沒有連接 LLM，不能假裝已理解或完成自由指令。此訊息只存在本機；可從「切換示範情境」測試已實作流程。</p>`)}}});
$('assetInput').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;if(f.size>25*1024*1024){toast('原型單檔上限 25 MB。');return}if(s.asset?.objectURL)URL.revokeObjectURL(s.asset.objectURL);s.asset={name:f.name,mime:f.type,size:f.size,objectURL:URL.createObjectURL(f),sample:false};s.rights=false;s.phase='material';log('收到本機檔案','僅在瀏覽器預覽，未傳送、未審核');route('material');e.target.value=''});
document.addEventListener('keydown',e=>{if(!modal)return;if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){const els=[...document.querySelectorAll('.dialog button:not(:disabled),.dialog input,.dialog textarea,.dialog select,.dialog a,.dialog summary')];const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
// Exposed only for local prototype tests; not an application/backend API.
window.uxPrototype={getState:()=>JSON.parse(JSON.stringify(s)),reset:()=>handle('reset'),act:handle,fixtureReview:()=>{fixtureApproved();s.approvedRevision=null;s.phase='review';s.web='not_started';s.partner='not_started';route('review')},version:'UX-2.0'};
render();
</script>
